<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Claude Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f13;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: spin 4s linear infinite;
    }
    .ring::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #cc785c;
      border-right-color: #cc785c44;
      filter: blur(1px);
    }
    .ring-2 {
      inset: 20px;
      animation: spin 6s linear infinite reverse;
    }
    .ring-2::before {
      border-top-color: #e8a87c;
      border-right-color: #e8a87c44;
    }

    .logo-wrap {
      position: absolute;
      inset: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 150px;
      height: 150px;
      animation: breathe 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px #cc785c88);
    }

    .particles {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cc785c;
      top: 50%;
      left: 50%;
      transform-origin: 0 0;
      animation: orbit var(--dur) linear infinite;
      animation-delay: var(--delay);
    }
    .dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      filter: blur(3px);
      opacity: 0.6;
    }

    .label {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      color: #cc785c;
      font-size: 22px;
      letter-spacing: 6px;
      text-transform: uppercase;
      animation: fadeText 3s ease-in-out infinite;
      white-space: nowrap;
    }
    .label span {
      display: inline-block;
      animation: letterBounce 3s ease-in-out infinite;
    }
    .label span:nth-child(1) { animation-delay: 0.0s; }
    .label span:nth-child(2) { animation-delay: 0.1s; }
    .label span:nth-child(3) { animation-delay: 0.2s; }
    .label span:nth-child(4) { animation-delay: 0.3s; }
    .label span:nth-child(5) { animation-delay: 0.4s; }
    .label span:nth-child(6) { animation-delay: 0.5s; }

    .glow {
      position: absolute;
      inset: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #cc785c22 0%, transparent 70%);
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes orbit {
      0%   { transform: rotate(var(--start)) translateX(var(--radius)) scale(1); opacity: 1; }
      50%  { transform: rotate(calc(var(--start) + 180deg)) translateX(var(--radius)) scale(0.5); opacity: 0.4; }
      100% { transform: rotate(calc(var(--start) + 360deg)) translateX(var(--radius)) scale(1); opacity: 1; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes fadeText {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes letterBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="ring ring-2"></div>

    <div class="particles" id="particles"></div>

    <div class="logo-wrap">
      <canvas id="mascot" width="160" height="160" style="image-rendering:pixelated;animation:breathe 3s ease-in-out infinite;filter:drop-shadow(0 0 22px #cc785cbb)"></canvas>
    </div>

    <div class="label">
      <span>C</span><span>L</span><span>A</span><span>U</span><span>D</span><span>E</span>
    </div>
  </div>

  <script>
    // ── Clawd – pixel crab mascot ──
    const canvas = document.getElementById('mascot');
    const ctx = canvas.getContext('2d');

    const S  = 9;
    const OX = 8;
    const OY = 35;

    const _ = null;
    const O = '#cc785c';
    const L = '#e8a87c';
    const D = '#a05535';
    const B = '#1a1a22';
    const W = '#ffffff';

    const body = [
      [_,_,_,_,O,O,_,_,_,_,O,O,_,_,_,_],
      [_,_,_,O,O,O,O,_,_,O,O,O,O,_,_,_],
      [_,_,_,O,B,W,O,_,_,O,B,W,O,_,_,_],
      [D,O,D,_,D,O,O,O,O,O,O,D,_,D,O,D],
      [O,O,O,D,O,L,L,L,L,L,L,O,D,O,O,O],
      [O,O,O,D,O,L,L,L,L,L,L,O,D,O,O,O],
      [D,O,D,_,D,O,O,O,O,O,O,D,_,D,O,D],
    ];

    const legsA = [
      [_,_,_,_,D,O,_,_,_,_,O,D,_,_,_,_],
      [_,_,_,D,O,_,_,_,_,_,_,O,D,_,_,_],
      [_,_,D,O,_,_,_,_,_,_,_,_,O,D,_,_],
    ];
    const legsB = [
      [_,_,_,_,_,D,O,_,_,O,D,_,_,_,_,_],
      [_,_,_,_,D,O,_,_,_,_,O,D,_,_,_,_],
      [_,_,_,D,O,_,_,_,_,_,_,O,D,_,_,_],
    ];

    const blinkRow = [_,_,_,O,D,D,O,_,_,O,D,D,O,_,_,_];
    const waveR1   = [D,O,_,O,O,O,O,_,_,O,O,O,O,_,O,D];
    const waveR2   = [O,O,_,O,B,W,O,_,_,O,B,W,O,_,O,O];
    const waveR6   = [_,_,_,_,D,O,O,O,O,O,O,D,_,_,_,_];

    function buildFrame(f) {
      const blink  = f % 200 < 5;
      const waving = f % 200 >= 100 && f % 200 < 118;
      const legs   = Math.floor(f / 22) % 2 === 0 ? legsA : legsB;
      const rows = body.map((row, y) => {
        if (y === 2 && blink)  return blinkRow;
        if (y === 1 && waving) return waveR1;
        if (y === 2 && waving) return waveR2;
        if (y === 6 && waving) return waveR6;
        return row;
      });
      return [...rows, ...legs];
    }

    function drawMascot(f) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      buildFrame(f).forEach((row, y) =>
        row.forEach((c, x) => {
          if (!c) return;
          ctx.fillStyle = c;
          ctx.fillRect(OX + x * S, OY + y * S, S, S);
        })
      );
    }

    let frame = 0;
    function animateMascot() { drawMascot(frame++); requestAnimationFrame(animateMascot); }
    animateMascot();

    const container = document.getElementById('particles');
    const count = 12;
    const colors = ['#cc785c', '#e8a87c', '#ffd4b8', '#a05535'];

    for (let i = 0; i < count; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      const radius = 140 + Math.random() * 60;
      const start = (360 / count) * i;
      const dur = 5 + Math.random() * 4;
      const color = colors[i % colors.length];
      dot.style.cssText = `
        --radius: ${radius}px;
        --start: ${start}deg;
        --dur: ${dur}s;
        --delay: ${-Math.random() * dur}s;
        background: ${color};
        width: ${4 + Math.random() * 5}px;
        height: ${4 + Math.random() * 5}px;
        margin: -3px;
      `;
      container.appendChild(dot);
    }
  </script>
</body>
</html>
