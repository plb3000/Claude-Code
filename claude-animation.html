<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Claude Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f13;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 400px;
      height: 400px;
    }

    /* Orbiting ring */
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: spin 4s linear infinite;
    }
    .ring::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #cc785c;
      border-right-color: #cc785c44;
      filter: blur(1px);
    }
    .ring-2 {
      inset: 20px;
      animation: spin 6s linear infinite reverse;
    }
    .ring-2::before {
      border-top-color: #e8a87c;
      border-right-color: #e8a87c44;
    }

    /* Center logo */
    .logo-wrap {
      position: absolute;
      inset: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      width: 150px;
      height: 150px;
      animation: breathe 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px #cc785c88);
    }

    /* Particles */
    .particles {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cc785c;
      top: 50%;
      left: 50%;
      transform-origin: 0 0;
      animation: orbit var(--dur) linear infinite;
      animation-delay: var(--delay);
    }
    .dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      filter: blur(3px);
      opacity: 0.6;
    }

    /* Text */
    .label {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      color: #cc785c;
      font-size: 22px;
      letter-spacing: 6px;
      text-transform: uppercase;
      animation: fadeText 3s ease-in-out infinite;
      white-space: nowrap;
    }
    .label span {
      display: inline-block;
      animation: letterBounce 3s ease-in-out infinite;
    }
    .label span:nth-child(1) { animation-delay: 0.0s; }
    .label span:nth-child(2) { animation-delay: 0.1s; }
    .label span:nth-child(3) { animation-delay: 0.2s; }
    .label span:nth-child(4) { animation-delay: 0.3s; }
    .label span:nth-child(5) { animation-delay: 0.4s; }
    .label span:nth-child(6) { animation-delay: 0.5s; }

    /* Glow backdrop */
    .glow {
      position: absolute;
      inset: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #cc785c22 0%, transparent 70%);
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes orbit {
      0%   { transform: rotate(var(--start)) translateX(var(--radius)) scale(1); opacity: 1; }
      50%  { transform: rotate(calc(var(--start) + 180deg)) translateX(var(--radius)) scale(0.5); opacity: 0.4; }
      100% { transform: rotate(calc(var(--start) + 360deg)) translateX(var(--radius)) scale(1); opacity: 1; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes fadeText {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes letterBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="ring ring-2"></div>

    <div class="particles" id="particles"></div>

    <div class="logo-wrap">
      <!-- Claude mascot SVG -->
      <svg class="logo" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Body -->
        <rect x="28" y="60" width="64" height="58" rx="18" fill="#cc785c"/>
        <!-- Belly -->
        <ellipse cx="60" cy="82" rx="22" ry="20" fill="#e8a87c" opacity="0.6"/>
        <!-- Head -->
        <ellipse cx="60" cy="46" rx="30" ry="28" fill="#cc785c"/>
        <!-- Ears -->
        <ellipse cx="32" cy="26" rx="8" ry="10" fill="#cc785c"/>
        <ellipse cx="88" cy="26" rx="8" ry="10" fill="#cc785c"/>
        <ellipse cx="32" cy="26" rx="4" ry="6" fill="#e8a87c" opacity="0.7"/>
        <ellipse cx="88" cy="26" rx="4" ry="6" fill="#e8a87c" opacity="0.7"/>
        <!-- Eyes -->
        <ellipse cx="48" cy="44" rx="8" ry="9" fill="#1a1a22"/>
        <ellipse cx="72" cy="44" rx="8" ry="9" fill="#1a1a22"/>
        <!-- Eye shine -->
        <circle cx="51" cy="41" r="3" fill="white" opacity="0.9"/>
        <circle cx="75" cy="41" r="3" fill="white" opacity="0.9"/>
        <circle cx="52" cy="42" r="1.2" fill="white"/>
        <circle cx="76" cy="42" r="1.2" fill="white"/>
        <!-- Nose -->
        <ellipse cx="60" cy="54" rx="4" ry="2.5" fill="#a05535"/>
        <!-- Smile -->
        <path d="M50 60 Q60 68 70 60" stroke="#a05535" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <!-- Blush -->
        <ellipse cx="38" cy="54" rx="7" ry="4" fill="#ffd4b8" opacity="0.5"/>
        <ellipse cx="82" cy="54" rx="7" ry="4" fill="#ffd4b8" opacity="0.5"/>
        <!-- Arms -->
        <rect x="8" y="68" width="22" height="12" rx="6" fill="#cc785c" transform="rotate(-15 8 68)"/>
        <rect x="90" y="68" width="22" height="12" rx="6" fill="#cc785c" transform="rotate(15 90 68)"/>
        <!-- Legs -->
        <rect x="36" y="112" width="18" height="20" rx="9" fill="#cc785c"/>
        <rect x="66" y="112" width="18" height="20" rx="9" fill="#cc785c"/>
        <!-- Feet -->
        <ellipse cx="45" cy="132" rx="11" ry="6" fill="#a05535"/>
        <ellipse cx="75" cy="132" rx="11" ry="6" fill="#a05535"/>
        <!-- Antenna -->
        <line x1="60" y1="18" x2="60" y2="6" stroke="#e8a87c" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="60" cy="5" r="4" fill="#ffd4b8"/>
        <circle cx="60" cy="5" r="2" fill="#cc785c"/>
      </svg>
    </div>

    <div class="label">
      <span>C</span><span>L</span><span>A</span><span>U</span><span>D</span><span>E</span>
    </div>
  </div>

  <script>
    const container = document.getElementById('particles');
    const count = 12;
    const colors = ['#cc785c', '#e8a87c', '#ffd4b8', '#a05535'];

    for (let i = 0; i < count; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      const radius = 140 + Math.random() * 60;
      const start = (360 / count) * i;
      const dur = 5 + Math.random() * 4;
      const color = colors[i % colors.length];
      dot.style.cssText = `
        --radius: ${radius}px;
        --start: ${start}deg;
        --dur: ${dur}s;
        --delay: ${-Math.random() * dur}s;
        background: ${color};
        width: ${4 + Math.random() * 5}px;
        height: ${4 + Math.random() * 5}px;
        margin: -3px;
      `;
      container.appendChild(dot);
    }
  </script>
</body>
</html>
